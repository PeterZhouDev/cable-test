<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable Test Sheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#003057',
                        secondary: '#00457a',
                    }
                }
            }
        }
    </script>
    
    <style>
        canvas {
            touch-action: none;
        }
    </style>

</head>
<body class="bg-gradient-to-br from-[#003057] to-[#001a32] min-h-screen p-2 sm:p-3 md:p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-4 sm:mb-5 md:mb-6">
            <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-white mb-1 drop-shadow-lg">📋 Cable Test Sheet</h1>
        </div>

        <!-- Tab Navigation -->
        <div id="tabNavigation" class="flex gap-1 sm:gap-2 mb-3 sm:mb-4 md:mb-6 flex-wrap"></div>

        <!-- New Test Tab -->
        <div id="new-test" class="tab-content active bg-white rounded-b-lg rounded-tr-lg shadow-2xl p-3 sm:p-4 md:p-6 lg:p-8 mb-4 sm:mb-6">
            <form id="testForm" class="space-y-3 sm:space-y-4 md:space-y-6"></form>
        </div>

        <!-- Records Tab -->
        <div id="records" class="tab-content hidden bg-white rounded-b-lg rounded-tr-lg shadow-2xl p-3 sm:p-4 md:p-6 lg:p-8">
            <div class="mb-4 sm:mb-5 md:mb-6">
                <div class="flex gap-1.5 sm:gap-2 md:gap-3 mb-3 sm:mb-4">
                    <input type="text" id="searchInput" placeholder="Search Cable ID..." class="flex-1 px-2 sm:px-3 md:px-4 py-1.5 sm:py-2 md:py-3 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#003057] focus:border-transparent transition">
                    <button onclick="app.records.search()" class="px-2 sm:px-3 md:px-6 py-1.5 sm:py-2 md:py-3 bg-[#003057] hover:bg-[#001a32] text-white font-bold text-xs sm:text-sm md:text-base rounded-lg transition">🔍</button>
                    <button onclick="app.records.resetSearch()" class="px-2 sm:px-3 md:px-6 py-1.5 sm:py-2 md:py-3 bg-gray-600 hover:bg-gray-700 text-white font-bold text-xs sm:text-sm md:text-base rounded-lg transition">Reset</button>
                </div>

                <div class="flex flex-wrap gap-2 sm:gap-3 items-center bg-gray-50 p-2 sm:p-3 md:p-4 rounded-lg border border-gray-200">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="selectAllCheckbox" onchange="app.records.toggleSelectAll()" class="w-4 h-4 text-[#003057] rounded focus:ring-2 focus:ring-[#003057]">
                        <span class="font-semibold text-gray-700 text-xs sm:text-sm">Select All</span>
                    </label>
                    <div class="flex-1"></div>
                    <button onclick="app.export.batchPDF()" class="px-2 sm:px-3 md:px-4 py-1 sm:py-1.5 md:py-2 bg-green-600 hover:bg-green-700 text-white font-bold text-xs sm:text-sm rounded-lg transition">📄 Batch PDF</button>
                    <button onclick="app.export.batchCSV()" class="px-2 sm:px-3 md:px-4 py-1 sm:py-1.5 md:py-2 bg-yellow-600 hover:bg-yellow-700 text-white font-bold text-xs sm:text-sm rounded-lg transition">📊 Batch CSV</button>
                </div>
            </div>
            <div id="recordsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3 md:gap-4"></div>
        </div>
    </div>

    <!-- View Record Modal -->
    <div id="viewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-2 sm:p-4">
        <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-[95vh] overflow-y-auto">
            <div class="sticky top-0 bg-white flex justify-between items-center p-2 sm:p-3 md:p-4 border-b-2 border-[#003057]">
                <h2 class="text-base sm:text-lg md:text-2xl font-bold text-gray-800">Details</h2>
                <button onclick="app.ui.closeModal('viewModal')" class="text-2xl sm:text-3xl text-gray-400 hover:text-gray-600 transition">&times;</button>
            </div>
            <div id="viewModalBody" class="p-2 sm:p-3 md:p-4 lg:p-6"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
